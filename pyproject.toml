[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zr"
version = "0.0.6"
description = "AdWords reporting tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "t-c-w" },
]
keywords = ["adwords", "reporting", "advertising", "dataframe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "numpy",
    "pandas",
    "utcw",
]

[project.urls]
Homepage = "https://github.com/t-c-w/zr"
Repository = "https://github.com/t-c-w/zr"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["zr"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["**/*.ipynb", ".git", ".venv", "build", "dist", "tests", "examples", "scrap"]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["zr"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
